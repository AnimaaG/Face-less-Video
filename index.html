<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Video Studio</title>
    <style>
        :root {
            --bg-main: #12141a;
            --bg-panel: #1b1e26;
            --bg-editor: #0f1115;
            --border: #2a2e3a;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            height: 60px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Buttons & Toggles */
        button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .btn-outline {
            background-color: transparent;
            border-color: var(--border);
            color: var(--text-main);
        }
        .btn-outline:hover { background-color: rgba(255, 255, 255, 0.05); }

        .audio-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            user-select: none;
        }

        .recording-timer {
            font-family: monospace;
            font-size: 1rem;
            color: var(--danger);
            display: none;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .pulse-indicator {
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Workspace Grid */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* Editor Section */
        .editor-container {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-editor);
        }

        .section-header {
            height: 40px;
            padding: 0 1rem;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            flex: 1;
            background: transparent;
            color: #d1d5db;
            border: none;
            outline: none;
            resize: none;
            padding: 1rem;
            font-family: "Fira Code", monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            tab-size: 2;
        }

        /* Preview Stage */
        .preview-container {
            display: flex;
            flex-direction: column;
            background-color: #0b0c0e;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        .stage-wrapper {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Fullscreen styles for Stage Wrapper */
        .stage-wrapper:fullscreen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 5-Second Hold Countdown Overlay */
        .countdown-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            color: #fff;
            text-align: center;
        }

        .countdown-number {
            font-size: 6rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 1rem;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .countdown-tip {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-main);
            max-width: 480px;
            line-height: 1.5;
        }

        .countdown-tip span {
            color: var(--danger);
            font-weight: 700;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Export / Video Download Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            width: 90%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-content video {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            background-color: #000;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Controls -->
    <header>
        <div class="brand">
            <span class="brand-dot"></span>
            HTML Video Studio
        </div>

        <div class="controls">
            <!-- Recording Indicator & Timer -->
            <div class="recording-timer" id="recordingTimer">
                <span class="pulse-indicator"></span>
                <span id="timeDisplay">00:00</span>
            </div>

            <!-- Audio Options -->
            <label class="audio-toggle">
                <input type="checkbox" id="micToggle"> Include Mic Audio
            </label>

            <!-- Actions -->
            <button class="btn-outline" id="runBtn">▶ Run Preview</button>
            <button class="btn-danger" id="recordBtn">● Start Recording</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- HTML Code Editor -->
        <section class="editor-container">
            <div class="section-header">
                <span>Code Editor (HTML, CSS, JS)</span>
                <span>Auto-Stop Hook Ready</span>
            </div>
            <textarea id="codeEditor" spellcheck="false"></textarea>
        </section>

        <!-- Preview Stage -->
        <section class="preview-container">
            <div class="stage-wrapper" id="stageWrapper">
                <!-- 5s Hold Overlay -->
                <div class="countdown-overlay" id="countdownOverlay">
                    <div class="countdown-number" id="countdownNumber">5</div>
                    <div class="countdown-tip">
                        Click <span>"Hide"</span> on the bottom screen-share toolbar now!<br>
                        Recording starts immediately after.
                    </div>
                </div>
                <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
            </div>
        </section>
    </div>

    <!-- Export / Video Download Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <h3>Recording Complete</h3>
            <video id="recordedVideo" controls autoplay playsinline></video>
            <div class="modal-actions">
                <button class="btn-outline" id="closeModalBtn">Dismiss</button>
                <button class="btn-primary" id="downloadWebmBtn">Download WebM</button>
                <button class="btn-primary" id="downloadMp4Btn" style="display:none;">Download MP4</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Selectors
        const codeEditor = document.getElementById('codeEditor');
        const previewFrame = document.getElementById('previewFrame');
        const stageWrapper = document.getElementById('stageWrapper');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNumber = document.getElementById('countdownNumber');
        const runBtn = document.getElementById('runBtn');
        const recordBtn = document.getElementById('recordBtn');
        const micToggle = document.getElementById('micToggle');
        const recordingTimer = document.getElementById('recordingTimer');
        const timeDisplay = document.getElementById('timeDisplay');
        const exportModal = document.getElementById('exportModal');
        const recordedVideo = document.getElementById('recordedVideo');
        const downloadWebmBtn = document.getElementById('downloadWebmBtn');
        const downloadMp4Btn = document.getElementById('downloadMp4Btn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // State variables
        let mediaRecorder = null;
        let recordedChunks = [];
        let timerInterval = null;
        let recordingSeconds = 0;
        let isRecording = false;
        let mixedStream = null;

        // Default Animation Template with TTS Voice-over & Auto-Stop Signal
        const defaultTemplate = `<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #1e1b4b, #0f172a);
    color: white;
    font-family: sans-serif;
    overflow: hidden;
  }
  .card {
    text-align: center;
    transform: scale(0.6);
    opacity: 0;
    animation: entrance 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .orb {
    width: 90px;
    height: 90px;
    background: linear-gradient(45deg, #ec4899, #8b5cf6);
    border-radius: 50%;
    margin: 0 auto 20px auto;
    filter: blur(1px);
    box-shadow: 0 0 35px #8b5cf6;
    animation: float 2s ease-in-out infinite alternate;
  }
  h1 { font-size: 2.5rem; margin: 0; font-weight: 800; }
  p { color: #94a3b8; font-size: 1.2rem; margin-top: 10px; }
  .caption {
    margin-top: 30px;
    font-size: 1rem;
    color: #38bdf8;
    background: rgba(0,0,0,0.4);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(56, 189, 248, 0.3);
  }
  @keyframes entrance {
    0% { transform: scale(0.6); opacity: 0; }
    50% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes float {
    from { transform: translateY(0px); }
    to { transform: translateY(-15px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1>Motion Studio AI</h1>
    <p>Automated Recording & Voiceover</p>
    <div class="caption" id="captionBox">Initializing audio...</div>
  </div>

  <script>
    // Audio synthesis / Voiceover
    function speakText(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.onend = callback;
        window.speechSynthesis.speak(utterance);
      } else {
        setTimeout(callback, 3000);
      }
    }

    const narration = "Welcome to HTML Video Studio. High quality capture with automatic export.";
    document.getElementById('captionBox').innerText = narration;

    // Start narration and complete video automatically
    setTimeout(() => {
      speakText(narration, () => {
        setTimeout(() => {
          // Tell the parent studio that the animation is finished
          window.parent.postMessage({ type: 'ANIMATION_COMPLETE' }, '*');
        }, 1000);
      });
    }, 500);
  <\/script>
</body>
</html>`;

        // Initialize Editor
        codeEditor.value = defaultTemplate;

        function updatePreview() {
            previewFrame.srcdoc = codeEditor.value;
        }

        runBtn.addEventListener('click', updatePreview);
        window.addEventListener('load', updatePreview);

        // Recording Button Handler
        recordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                initiateRecordingSequence();
            }
        });

        // Step 1: Prompt Share -> Make Fullscreen -> 5s Hold Countdown -> Start
        async function initiateRecordingSequence() {
            try {
                // Request Screen + Audio sharing
                const displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { displaySurface: "browser", frameRate: 60 },
                    audio: true
                });

                // Request optional microphone
                const audioTracks = [];
                if (micToggle.checked) {
                    try {
                        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        audioTracks.push(...micStream.getAudioTracks());
                    } catch (err) {
                        console.warn("Microphone access unavailable or denied:", err);
                    }
                }

                // Audio mixing
                const displayAudioTracks = displayStream.getAudioTracks();
                let finalAudioTracks = [];

                if (displayAudioTracks.length > 0 && audioTracks.length > 0) {
                    const audioCtx = new AudioContext();
                    const dest = audioCtx.createMediaStreamDestination();
                    const src1 = audioCtx.createMediaStreamSource(new MediaStream([displayAudioTracks[0]]));
                    const src2 = audioCtx.createMediaStreamSource(new MediaStream([audioTracks[0]]));
                    src1.connect(dest);
                    src2.connect(dest);
                    finalAudioTracks = dest.stream.getAudioTracks();
                } else {
                    finalAudioTracks = displayAudioTracks.length > 0 ? displayAudioTracks : audioTracks;
                }

                mixedStream = new MediaStream([
                    ...displayStream.getVideoTracks(),
                    ...finalAudioTracks
                ]);

                // Determine video container codec
                let mimeType = 'video/webm;codecs=vp9,opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
                if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
                    downloadMp4Btn.style.display = 'inline-flex';
                }

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(mixedStream, { mimeType });
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = handleRecordingComplete;

                // Stop recording if the browser share bar is closed manually
                displayStream.getVideoTracks()[0].onended = () => {
                    if (isRecording) stopRecording();
                };

                // Request Fullscreen immediately after user confirms share
                if (stageWrapper.requestFullscreen) {
                    await stageWrapper.requestFullscreen().catch((err) => console.warn(err));
                }

                // Run 5-second hold countdown overlay
                countdownOverlay.style.display = 'flex';
                let holdSeconds = 5;
                countdownNumber.innerText = holdSeconds;

                const holdInterval = setInterval(() => {
                    holdSeconds--;
                    if (holdSeconds > 0) {
                        countdownNumber.innerText = holdSeconds;
                        // Trigger re-render of pop-in animation
                        countdownNumber.style.animation = 'none';
                        void countdownNumber.offsetWidth;
                        countdownNumber.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    } else {
                        clearInterval(holdInterval);
                        countdownOverlay.style.display = 'none';
                        startActualRecording();
                    }
                }, 1000);

            } catch (err) {
                console.error("Recording authorization was canceled or failed:", err);
            }
        }

        // Step 2: Start capturing & reload animation from fresh zero state
        function startActualRecording() {
            // Fresh reload of preview animation at zero seconds
            updatePreview();

            mediaRecorder.start(200);
            isRecording = true;

            // UI updates
            recordBtn.textContent = '■ Stop Recording';
            recordBtn.classList.replace('btn-danger', 'btn-outline');
            recordingTimer.style.display = 'inline-flex';
            startTimer();
        }

        // Stop Recording
        function stopRecording() {
            if (!isRecording && !mediaRecorder) return;

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (mixedStream) {
                mixedStream.getTracks().forEach(track => track.stop());
            }

            // Exit Fullscreen if active
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => console.warn(err));
            }

            isRecording = false;
            recordBtn.textContent = '● Start Recording';
            recordBtn.classList.replace('btn-outline', 'btn-danger');
            recordingTimer.style.display = 'none';
            stopTimer();
        }

        // Automatic Stop Listener via postMessage
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'ANIMATION_COMPLETE') {
                if (isRecording) {
                    console.log('Animation completed. Auto-stopping recording...');
                    stopRecording();
                }
            }
        });

        // Timer handlers
        function startTimer() {
            recordingSeconds = 0;
            timeDisplay.textContent = '00:00';
            timerInterval = setInterval(() => {
                recordingSeconds++;
                const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
                const secs = String(recordingSeconds % 60).padStart(2, '0');
                timeDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        // Video Export & Download Dialog
        function handleRecordingComplete() {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            const videoUrl = URL.createObjectURL(blob);
            recordedVideo.src = videoUrl;
            exportModal.style.display = 'flex';

            downloadWebmBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = videoUrl;
                a.download = `studio-video-${Date.now()}.webm`;
                a.click();
            };

            downloadMp4Btn.onclick = () => {
                const a = document.createElement('a');
                a.href = videoUrl;
                a.download = `studio-video-${Date.now()}.mp4`;
                a.click();
            };
        }

        closeModalBtn.addEventListener('click', () => {
            exportModal.style.display = 'none';
            recordedVideo.pause();
        });
    </script>
</body>
</html>

<!--
Act as a Creative Motion Graphics Director and Senior Front-End Video Engineer. 

Create a complete, single-file HTML/CSS/JS animation code designed to be rendered and recorded inside an automated HTML Video Studio.

Here are the specifications for the video:

- Target Duration: [e.g., 15 seconds / 30 seconds / 60 seconds]
- Scene Breakdown & Script:
  * Scene 1 (0s - 5s): [Describe visuals, character action, and spoken narration]
  * Scene 2 (5s - 15s): [Describe visuals, character action, and spoken narration]
  * Scene 3 (15s - 30s): [Describe call to action / ending]

2. LANGUAGE & VOICE-OVER (TTS):
- Spoken Language: [e.g., English (en-US), Spanish (es-ES), Hindi (hi-IN), French (fr-FR)]
- Voice Gender: [Male / Female]
- Audio Implementation: Use the browser's native window.speechSynthesis API to speak the narration script automatically. Timed dynamically to match the visual scene transitions. Add real-time subtitles/captions at the bottom of the screen.

3. VISUAL STYLE & CHARACTERS:
- Visual Style: [Choose one: 2D Flat Motion Design / Isometric Vector / Cyberpunk Neon / 3D Three.js WebGL / Storybook Cartoon]

- Backgrounds & Effects: Dynamic CSS animations, particle effects, smooth camera transitions, or layered parallax.

4. CRITICAL TECHNICAL REQUIREMENTS:
- Self-Contained: Output everything in one single HTML file (HTML + embedded <style> + embedded <script>).
- External Libraries: If 3D or advanced vector rigging is needed, load them only from public CDNs (e.g., Three.js, GSAP, or Lottie-web). Do not use local files or broken image links.
- 16:9 Responsive Ratio: The composition must fill 100vw and 100vh, perfectly framed for a 1920x1080 video frame.
- Sound & Tone: Include subtle procedural audio (using Web Audio API oscillators/chimes) for transitions or background atmosphere so the audio recorder captures rich audio.
- MANDATORY AUTO-STOP SIGNAL: When the animation and voice-over finish at the exact target duration, trigger this exact JavaScript line so the recording studio automatically stops recording:
  window.parent.postMessage({ type: 'ANIMATION_COMPLETE' }, '*');

Now, generate the complete, production-ready HTML code without markdown placeholders or cutoffs.
 -->
